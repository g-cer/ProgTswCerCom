name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  war:
    name: Compila la WAR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Compila
        run: mvn -B clean package

      - name: Pubblica l'artefatto
        uses: actions/upload-artifact@v4
        with:
          name: keyitaly-war
          path: target/keyitaly.war
